<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Le pattern et le style seront injectés ici par le service -->
  </defs>
  
  <!-- Manche gauche -->
  <path 
    id="manche_gauche_path"
    d="M 20 20 L 20 80 L 60 80 L 60 20 Z"
    fill="url(#userDesignPattern)"
    stroke="#000000"
    stroke-width="0.5"
  />
  
  <!-- Manche droite -->
  <path 
    id="manche_droite_path"
    d="M 140 20 L 140 80 L 180 80 L 180 20 Z"
    fill="url(#userDesignPattern)"
    stroke="#000000"
    stroke-width="0.5"
  />
  
  <!-- Torse -->
  <path 
    id="torse_path"
    d="M 40 100 L 40 180 L 160 180 L 160 100 Z"
    fill="url(#userDesignPattern)"
    stroke="#000000"
    stroke-width="0.5"
  />
  
  <!-- Lignes de découpe (optionnel) -->
  <path 
    d="M 20 20 L 20 80 L 60 80 L 60 20 Z"
    fill="none"
    stroke="#CCCCCC"
    stroke-width="0.2"
    stroke-dasharray="2,2"
  />
  <path 
    d="M 140 20 L 140 80 L 180 80 L 180 20 Z"
    fill="none"
    stroke="#CCCCCC"
    stroke-width="0.2"
    stroke-dasharray="2,2"
  />
  <path 
    d="M 40 100 L 40 180 L 160 180 L 160 100 Z"
    fill="none"
    stroke="#CCCCCC"
    stroke-width="0.2"
    stroke-dasharray="2,2"
  />
</svg>
